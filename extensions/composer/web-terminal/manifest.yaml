name: web-terminal
parent: composer
categories:
  - Misc
author: Anton Kanugalawattage
description: Host an interactive terminal inside Envoy, streamed over SSE.
longDescription: |
  Hosts an interactive shell (default `/bin/bash`) inside Envoy and exposes it to
  the browser without any backend server. The PTY runs in the Envoy process; its
  output is streamed to the client over a never-closing HTTP response as
  Server-Sent Events, and input and resize events come back as short POST
  requests correlated by a session id. Because it runs as a composer HTTP filter,
  no upstream cluster or extra port is required — Envoy hosts the session directly.

  ## Protocol

  The transport is plain HTTP and client-agnostic — any client can implement it:

  - `GET /stream?sid=<id>&cols=<n>&rows=<n>`
    A `text/event-stream` where each `data:` event is a base64-encoded chunk of
    PTY output. Opening the stream spawns the PTY for `sid`; closing it (client
    disconnect) tears the PTY down. A final `event: exit` is sent on shell exit.
  - `POST /input?sid=<id>`
    The request body is written to the PTY.
  - `POST /resize?sid=<id>&cols=<n>&rows=<n>`
    Resizes the PTY.

  ## Frontend

  A small `xterm.js` client is bundled and served by default — the
  endpoints above are the primary interface, so bring your own client (e.g. an
  application's own terminal view). Set `serve_frontend: false` to disable the
  bundled client at `/`.

  ## Security

  A browser terminal is remote code execution by design — do not expose it
  without protection. Set `basic_auth` to require a login: the browser shows
  its native login dialog before any endpoint can be used. Define users with
  a simple `users` name-to-password map, an htpasswd file (`htpasswd -B`), or
  both. Passwords in the `users` map are plaintext in the config, so prefer
  an htpasswd file when the config may be seen by others.

  Use TLS in front of the listener, as Basic auth sends credentials with
  every request. Without `basic_auth`, restrict access to the listener
  (network policy or an auth filter earlier in the chain) before exposing it.
type: go
tags:
  - go
  - http
  - terminal
  - pty
  - sse
license: Apache-2.0
examples:
  - title: Serve the bundled xterm.js client (default)
    description: |
      The bundled frontend is served by default; open it in the browser at
      http://localhost:10000/
    code: |
      boe run --extension web-terminal
  - title: API only, bring your own client and custom shell command
    description: |
      Disable the bundled frontend and drive the /stream, /input and /resize
      endpoints from your own client. Also use a custom shell command
    code: |
      boe run --extension web-terminal --config '{
        "command": "/bin/sh",
        "serve_frontend": false
      }'
  - title: Require a login (HTTP Basic auth)
    description: |
      Protect all endpoints with a quick inline user map; the browser shows its
      native login dialog. Passwords here are plaintext — for hashed
      credentials use an htpasswd file instead.
    code: |
      boe run --extension web-terminal --config '{
        "basic_auth": {
          "users": { "admin": "secret" }
        }
      }'
  - title: Require a login from an htpasswd file
    description: |
      Load hashed credentials from an existing htpasswd file. Create one with
      `htpasswd -cB /etc/envoy/htpasswd admin` (bcrypt and passlib
      PBKDF2-SHA256 entries are supported); the file is read once at startup.
    code: |
      boe run --extension web-terminal --config '{
        "basic_auth": {
          "htpasswd": { "file": "/etc/envoy/htpasswd" }
        }
      }'
